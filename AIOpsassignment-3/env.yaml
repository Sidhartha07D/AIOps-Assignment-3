# Minimal environment for the submitted Spark and Ray scripts.
# Direct Python package versions match the supplied environment evidence.
# This is a curated specification, not a complete export or tested lockfile.
# OpenJDK 17 supplies the Java runtime required by Spark.
name: spark-ray-a3
channels:
  - conda-forge
dependencies:
  - python=3.11.17
  - pip
  - openjdk=17
  - pip:
      - pyspark==3.5.7
      - ray[data,default]==2.59.0
      - numpy==2.4.6
      - pandas==3.0.6
      - pyarrow==25.0.1
